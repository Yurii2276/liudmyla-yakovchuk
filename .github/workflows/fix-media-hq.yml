name: Fix Media gallery HQ photos

on:
  push:
    paths:
      - '.github/workflows/fix-media-hq.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point gallery to high-quality originals
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'media.html';
          let html = fs.readFileSync(file, 'utf8');
          html = html.replace(/assets\/media-signing\.webp(?:\?[^\"']*)?/g, 'assets/media-signing-hq.webp?v=hq1');
          html = html.replace(/assets\/media-terrace\.webp(?:\?[^\"']*)?/g, 'assets/media-terrace-hq.webp?v=hq1');
          fs.writeFileSync(file, html);
          NODE

      - name: Commit gallery fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Use high-quality original Media gallery photos"
            git push origin HEAD:main
          fi
